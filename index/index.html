    .term .d{font-size:13px;color:var(--muted);line-height:1.5}
    .term .d p{margin:0 0 6px 0}

    footer{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}

<script>
// Data: array of {letter, key, en, fi}
const TERMS = [
  // --- A ---
  {letter:'A', key:'A/B Test', en:'A controlled experiment comparing two versions of a page or feature to see which performs better.', fi:'Kahden version vertailu konversioiden optimointiin.'},
  {letter:'A', key:'Acceleration (Single/Double Trigger)', en:'A clause that speeds up vesting on specified events. Single = acquisition; Double = acquisition plus termination.', fi:'Vestingin nopeutus. Single = yrityskaupassa; Double = yrityskauppa + irtisanominen.'},
  {letter:'A', key:'ACV — Annual Contract Value', en:'The annualized revenue value of a contract with a customer.', fi:'Asiakassopimuksen vuosiarvo.'},
  {letter:'A', key:'AARRR — Acquisition, Activation, Retention, Revenue, Referral', en:'A growth funnel framework that tracks user lifecycle stages from acquisition to referral.', fi:'Growth hacking -malli.'},
  {letter:'A', key:'AIF — Alternative Investment Fund', en:'A regulated fund type for non-traditional investments like venture or private equity.', fi:'Rahaston juridinen luokitus.'},
  {letter:'A', key:'Anti-Dilution', en:'Contractual protection that adjusts investor conversion terms to limit dilution in down rounds.', fi:'Suoja down roundeissa. Esim. Full Ratchet tai Weighted Average.'},
  {letter:'A', key:'ARR — Annual Recurring Revenue', en:'Normalized recurring revenue on an annual basis (MRR × 12 for simple cases).', fi:'SaaS-liikevaihto vuodessa.'},
  {letter:'A', key:'AS — Authorized Shares', en:'The maximum number of shares a company is authorized to issue, per its articles.', fi:'Suurin sallittu osakemäärä yhtiöjärjestyksessä.'},

  // --- B ---
  {letter:'B', key:'Bad Leaver', en:'A departing employee who loses unvested shares or faces penalties due to contract breaches.', fi:'Lähtijä menettää vestautumattomat tai jopa vestatut osakkeet (esim. rikkomus, kilpailukielto).'},
  {letter:'B', key:'Benchmarking', en:'Comparing your KPIs to industry standards to identify strengths and weaknesses.', fi:'Vertailu alan normaaleihin KPI-arvoihin.'},
  {letter:'B', key:'Board Observer Rights', en:'Right for an investor to attend board meetings without voting power.', fi:'Sijoittajalla oikeus osallistua hallitukseen ilman äänivaltaa.'},
  {letter:'B', key:'BOM — Bill of Materials', en:'A list of components and costs required to build a hardware product.', fi:'Hardware-tuotteen materiaalilista.'},
  {letter:'B', key:'Bootstrapping', en:'Growing a company using internal cash flow and limited external funding.', fi:'Kasvu ilman ulkopuolista rahoitusta.'},
  {letter:'B', key:'Burn / Burn Rate', en:'The rate at which a company is spending its cash reserves, usually per month.', fi:'Kassankulutus per kuukausi.'},
  {letter:'B', key:'Burn Multiple', en:'Net cash burned divided by net new ARR — a measure of capital efficiency for growth.', fi:'Kuinka tehokkaasti burn muuttuu ARR-kasvuksi (net burn / uusi ARR).'},

  // --- C ---
  {letter:'C', key:'CAGR — Compound Annual Growth Rate', en:'The annual growth rate over multiple periods assuming compounding.', fi:'Keskimääräinen vuotuinen kasvu prosentteina.'},
  {letter:'C', key:'CAC — Customer Acquisition Cost', en:'Average cost to acquire a customer, including marketing and sales expenses.', fi:'Asiakkaan hankinnan kustannus.'},
  {letter:'C', key:'CAC Payback Period', en:'The time it takes for the contribution margin from a customer to cover the CAC.', fi:'Kuinka nopeasti hankintakulu maksaa itsensä takaisin.'},
  {letter:'C', key:'Cap Table (Capitalization Table)', en:'A table showing ownership, option pools, and securities outstanding.', fi:'Omistus-, optio- ja diluutiotaulukko.'},
  {letter:'C', key:'Capital Call', en:'A request by a fund to investors to contribute committed capital.', fi:'Rahaston vaatima lisäpanostus LP:iltä.'},
  {letter:'C', key:'CDA / NDA — Confidentiality / Non-Disclosure Agreement', en:'A legal agreement to keep shared information confidential.', fi:'Salassapitosopimus.'},
  {letter:'C', key:'Cliff', en:'A vesting feature where no options vest until a specified period has passed (e.g., 12 months).', fi:'Vesting alkaa vasta tietyn ajan jälkeen (tyypillisesti 12 kk).'},
  {letter:'C', key:'Clawback', en:'Contractual mechanism for repurchasing equity in certain leave or misconduct situations.', fi:'Yhtiö voi ostaa osuuksia takaisin esimerkiksi leaver-tilanteissa.'},
  {letter:'C', key:'CMGR — Compound Monthly Growth Rate', en:'Monthly growth rate compounded over multiple months.', fi:'Kuukausikasvu, laskettu korkoa korolle.'},
  {letter:'C', key:'Convertible Note', en:'A loan that converts into equity at a future financing round under preset terms.', fi:'Laina, joka muuttuu osakkeiksi tulevalla kierroksella.'},
  {letter:'C', key:'CSAT — Customer Satisfaction Score', en:'A metric indicating customer satisfaction, typically collected via survey.', fi:'Asiakastyytyväisyysmittari.'},
  {letter:'C', key:'Churn', en:'The rate at which customers or revenue are lost during a period.', fi:'Asiakashävikki tai liikevaihdon menetys.'},

  // --- D ---
  {letter:'D', key:'DAU / WAU / MAU', en:'Daily/Weekly/Monthly Active Users — measures engagement over different horizons.', fi:'Aktiiviset käyttäjät päivittäin/viikoittain/kuukausittain.'},
  {letter:'D', key:'DCF — Discounted Cash Flow', en:'Valuation method discounting expected future cash flows to present value.', fi:'Valuaatiomalli tulevien kassavirtojen nykyarvosta.'},
  {letter:'D', key:'DD — Due Diligence', en:'Comprehensive review process by investors before closing an investment.', fi:'Sijoittajan tekemä yritystarkastus.'},
  {letter:'D', key:'Dilution', en:'Reduction in ownership percentage after new shares are issued.', fi:'Omistuksen laimeneminen uusien osakkeiden myötä.'},
  {letter:'D', key:'Drag-Along', en:'Right that forces minority shareholders to join a sale approved by a majority.', fi:'Enemmistö voi pakottaa vähemmistön mukaan myyntiin samoilla ehdoilla.'},
  {letter:'D', key:'Down Round', en:'A financing round at a lower valuation than a prior round.', fi:'Rahoituskierros alemmalla valuaatiolla kuin edellinen; antidiluutio voi aktivoitua.'},

  // --- E (expanded with EBITDA variants included) ---
  {letter:'E', key:'EBITDA — Earnings Before Interest, Taxes, Depreciation and Amortization', en:'Operating profit before financing costs, taxes and non-cash depreciation/amortization.', fi:'Tulos ennen korkoja, veroja sekä poistoja ja arvonalentumisia.'},
  {letter:'E', key:'Adjusted EBITDA', en:'EBITDA adjusted for one-time, non-operational or unusual items to better reflect recurring performance.', fi:'Oikaistu EBITDA ei-toistuvilla tai kertaluonteisilla erillä oikaistuna.'},
  {letter:'E', key:'EBIT — Earnings Before Interest and Taxes', en:'Profit after depreciation and amortization but before interest and tax expenses.', fi:'Tulos ennen korkoja ja veroja.'},
  {letter:'E', key:'EBITA — Earnings Before Interest, Taxes and Amortization', en:'Profit excluding amortization but including depreciation.', fi:'Tulos ennen korkoja, veroja ja aineettomien hyödykkeiden poistoja.'},
  {letter:'E', key:'EBITDAR — EBITDA Before Rent', en:'EBITDA adding back rent expense to normalize businesses with heavy lease costs.', fi:'EBITDA ennen vuokrakuluja.'},
  {letter:'E', key:'EBITDARM — EBITDA Before Rent and Management Fees', en:'EBITDA before rent and management/royalty fees, common in hospitality/healthcare.', fi:'EBITDA ennen vuokria ja hallinnointipalkkioita.'},
  {letter:'E', key:'EBITDAX — EBITDA Excluding Exploration Costs', en:'EBITDA excluding exploration & appraisal costs (used in oil & gas).', fi:'EBITDA ilman etsintäkuluja.'},
  {letter:'E', key:'EBITDAaL — EBITDA After Leases', en:'EBITDA adjusted to reflect lease accounting under IFRS-16.', fi:'EBITDA vuokrien IFRS-16 -käsittelyn jälkeen.'},
  {letter:'E', key:'Cash EBITDA', en:'EBITDA adjusted to reflect cash nature of the business, sometimes deducting capex to approximate cash operating earnings.', fi:'Kassavirtaan perustuva EBITDA, jossa voidaan vähentää capex.'},
  {letter:'E', key:'Employee Productivity', en:'Metric that measures workforce output relative to hours worked or headcount.', fi:'Työvoiman tuottavuus. Kaava: Tuottavat tunnit / Työtunnit.'},
  {letter:'E', key:'Employee Engagement', en:'Degree to which employees are committed, motivated and satisfied at work.', fi:'Työntekijöiden sitoutuneisuus ja tyytyväisyys.'},
  {letter:'E', key:'Employee Turnover Rate', en:'Percentage of employees leaving during a period. Formula: (Employees left / Average headcount) × 100.', fi:'Henkilöstön vaihtuvuus. Kaava: Lähteneet työntekijät / Keskimääräinen työntekijämäärä * 100.'},
  {letter:'E', key:'Equity Financing', en:'Raising capital by selling shares to investors.', fi:'Osakepohjainen rahoitus.'},
  {letter:'E', key:'ESOP — Employee Stock Option Plan', en:'Program that grants employees the option to purchase company shares over time.', fi:'Henkilöstön optio-ohjelma.'},
  {letter:'E', key:'Exercise Price / Strike Price', en:'Price at which an option holder can buy the underlying share.', fi:'Optioiden lunastushinta.'},
  {letter:'E', key:'Exit', en:'A liquidity event for investors and founders, such as M&A or IPO.', fi:'Yrityskauppa, listautuminen tai muu likviditeettitapahtuma.'},

  // --- F ---
  {letter:'F', key:'FDD — Financial Due Diligence', en:'Deep dive into financial statements and controls before a deal.', fi:'Taloudellinen due diligence -tarkastus.'},
  {letter:'F', key:'FMV — Fair Market Value', en:'Price that a willing buyer would pay a willing seller in an arm’s-length transaction.', fi:'Käypä arvo, käytetään optioiden verotuksessa.'},
  {letter:'F', key:'FOMO — Fear of Missing Out', en:'Investor behavior driven by the desire not to miss high-return opportunities.', fi:'Sijoittajien kilpailutilannetta kuvaava termi.'},
  {letter:'F', key:'Founder Lock-Up', en:'A period after IPO during which founders cannot sell shares.', fi:'Ajanjakso, jolloin perustaja ei saa myydä osakkeitaan.'},
  {letter:'F', key:'Fully Diluted Shares', en:'Total number of shares outstanding including options, convertibles and warrants.', fi:'Osakemäärä sisältäen optiot, konvertit, warrantit yms.'},

  // --- G ---
  {letter:'G', key:'GM — Gross Margin', en:'Percentage of revenue remaining after COGS are deducted. Formula: (Revenue − COGS) / Revenue.', fi:'Bruttokate, myyntien jälkeiset muuttuvat kustannukset vähennettynä.'},
  {letter:'G', key:'GMV — Gross Merchandise Value', en:'Total value of goods sold through a marketplace in a period.', fi:'Markkinapaikan kautta kulkeva kokonaismyyntivolyymi.'},
  {letter:'G', key:'Good Leaver', en:'Employee leaving under acceptable circumstances and typically retaining vested shares.', fi:'Lähtijä, joka saa yleensä pitää vestatut osakkeensa ja joskus osan vestautumattomista.'},

  // --- H ---
  {letter:'H', key:'Haircut', en:'A reduction applied to asset valuations or credit limits.', fi:'Alennus valuaatiosta tai arvon leikkaus; usein neuvottelutermi.'},
  {letter:'H', key:'Hurdle Rate', en:'Minimum return required by an investor or fund before performance fees are paid.', fi:'Rahaston minimituottovaatimus ennen carryn jakamista.'},

  // --- I ---
  {letter:'I', key:'Information Rights', en:'Investor rights to receive financial statements and reports.', fi:'Sijoittajan oikeus talousraportteihin ja muuhun informaatioon.'},
  {letter:'I', key:'IP Assignment / IPR Transfer', en:'Transfer of intellectual property rights from founders to the company.', fi:'Tekijänoikeuksien ja keksintöjen siirto yhtiölle.'},
  {letter:'I', key:'Invoice Processing Time', en:'The time and efficiency of processing supplier/customer invoices; shorter times improve cash flow.', fi:'Laskujen käsittelyaika ja tehokkuus.'},
  {letter:'I', key:'Inventory Turnover', en:'How many times inventory is sold and replaced in a period. Formula: COGS / Average inventory.', fi:'Varaston kierto. Kaava: Myytyjen tuotteiden kulut / Varaston keskiarvo.'},
  {letter:'I', key:'Interest Coverage Ratio', en:'Shows how easily a company can pay interest: EBIT / Interest expense.', fi:'Mittaa miten helposti yritys pystyy maksamaan korkokulunsa. Kaava: EBIT / Korkokulut.'},

  // --- K ---
  {letter:'K', key:'KISS — Keep It Simple Security', en:'A simple financing instrument similar to SAFE, created to simplify seed deals.', fi:'500 Startupsin kehittämä SAFE-tyyppinen instrumentti.'},
  {letter:'K', key:'KPI — Key Performance Indicator', en:'A measurable value indicating how effectively a company is achieving key objectives.', fi:'Tärkeä suorituskykymittari.'},

  // --- L ---
  {letter:'L', key:'Lead Investor', en:'Primary investor who often sets terms for a financing round.', fi:'Kierroksen pääsijoittaja, joka usein määrittää ehdot.'},
  {letter:'L', key:'Liquidation Preference', en:'Investor right that determines payout priority and multiple on exit.', fi:'Sijoittajan etuoikeus exit-tuotoissa (esim. 1x, 2x, participating/non-participating).'},
  {letter:'L', key:'Lock-Up', en:'Post-IPO restriction preventing sale of shares for a set period.', fi:'Ajanjakso, jolloin osakkeita ei saa myydä (IPO:ssa tai sekundaarimarkkinassa).'},
  {letter:'L', key:'LTV — Lifetime Value', en:'Present value of the gross profit from a customer over the entire relationship.', fi:'Asiakkaan elinkaaren arvo yritykselle.'},
  {letter:'L', key:'LTV/CAC Ratio', en:'Measures unit economics efficiency: LTV divided by CAC; >3x often cited as healthy.', fi:'Suhdeluku, joka kertoo hankinnan kannattavuudesta; >3x suositeltu.'},

  // --- M ---
  {letter:'M', key:'MFN — Most Favored Nation Clause', en:'Clause ensuring an investor receives future terms at least as favorable as others.', fi:'Sijoittaja saa tulevaisuudessa parhaat ehdot, jos sellaisia annetaan.'},
  {letter:'M', key:'Management Fee', en:'Annual fee charged by fund managers, typically around 2%.', fi:'Rahaston vuosittainen hallinnointipalkkio (tyypillisesti ~2%).'},
  {letter:'M', key:'MoM — Month-over-Month Growth', en:'Percentage growth compared to the previous month.', fi:'Kuukausittainen kasvu.'},
  {letter:'M', key:'MRR — Monthly Recurring Revenue', en:'Recurring revenue normalized to a monthly period.', fi:'Kuukausittainen toistuva liikevaihto.'},
  {letter:'M', key:'MVP — Minimum Viable Product', en:'Most basic version of a product that allows testing of hypotheses with minimal effort.', fi:'Minimikelpoinen tuotteen versio arvon testaamiseen.'},
  {letter:'M', key:'Magic Number (SaaS)', en:'A metric evaluating sales efficiency: incremental ARR × 4 / sales & marketing spend.', fi:'Mittari, joka arvioi kasvun tehokkuutta suhteessa myyntiin/markkinointiin.'},
  {letter:'M', key:'MOIC — Multiple on Invested Capital', en:'Return multiple (e.g., 3×) on the invested capital.', fi:'Sijoitetun pääoman moninkertainen tuotto (esim. 3×).'},

  // --- N ---
  {letter:'N', key:'NAV — Net Asset Value', en:'Value of assets minus liabilities, often used in fund contexts.', fi:'Nettovarallisuuden arvo (rahastot/yritykset).'},
  {letter:'N', key:'NDA — Non-Disclosure Agreement', en:'Contract to protect confidential information shared between parties.', fi:'Salassapitosopimus.'},
  {letter:'N', key:'NPS — Net Promoter Score', en:'Measure of customer willingness to recommend, typically on a -100 to +100 scale.', fi:'Asiakastyytyväisyyden ja suosittelun mittari.'},
  {letter:'N', key:'NRR — Net Revenue Retention', en:'Revenue retained from existing customers including expansions and churn. Formula: (Starting revenue + expansions − churn) / Starting revenue.', fi:'Nettoliikevaihdon säilyminen olemassaolevilta asiakkailta, upsell mukaan.'},

  // --- O ---
  {letter:'O', key:'OKR — Objectives & Key Results', en:'Goal-setting framework linking objectives to measurable results.', fi:'Tavoite- ja mittarikehys organisaatiolle.'},
  {letter:'O', key:'Option Pool / ESOP Pool', en:'Shares reserved for employee incentives and recruitment.', fi:'Osakkeet varattu työntekijäoptioille.'},
  {letter:'O', key:'OSA / SHA — Osakassopimus / Shareholders\' Agreement', en:'Agreement setting shareholder rights, transfer restrictions and governance rules.', fi:'Osakkaiden yhteiset ehdot ja oikeudet.'},

  // --- P ---
  {letter:'P', key:'P&L — Profit and Loss Statement', en:'Financial statement summarizing revenues, costs and profits for a period.', fi:'Tuloslaskelma.'},
  {letter:'P', key:'Participating Preferred', en:'Preferred shares that participate in distributions after their liquidation preference.', fi:'Sijoittaja saa pref-palautuksen ja sen jälkeen osuuden pro rata (double dip).'},
  {letter:'P', key:'Pay-to-Play', en:'Provision requiring investors to participate in future rounds to retain certain rights.', fi:'Ehto: sijoittajan on osallistuttava tuleviin kierroksiin säilyttääkseen oikeudet.'},
  {letter:'P', key:'PMF — Product-Market Fit', en:'When a product satisfies market demand and shows repeatable growth.', fi:'Tilanne, jossa tuote ratkaisee asiakkaiden tärkeän ongelman ja kasvu toistettavissa.'},
  {letter:'P', key:'PLG — Product-Led Growth', en:'Growth strategy where the product is the primary driver of user acquisition and retention.', fi:'Kasvumalli, jossa tuote itse ajaa käyttäjämuutoksen ja konversiot.'},
  {letter:'P', key:'Post-Money / Pre-Money Valuation', en:'Company valuation after / before a financing round, respectively.', fi:'Yrityksen arvo ennen ja jälkeen sijoituksen.'},
  {letter:'P', key:'Pro Rata Rights', en:'Investor right to participate in future financings to maintain ownership percentage.', fi:'Oikeus pitää omistusosuus seuraavissa kierroksissa.'},
  {letter:'P', key:'POC — Proof of Concept', en:'Small-scale test to demonstrate feasibility of a product or technology.', fi:'Konseptin toimivuuden näyttö.'},
  {letter:'P', key:'PQL — Product Qualified Lead', en:'User who demonstrates buying intent through product usage signals.', fi:'Käyttäjä, joka tuotteessa osoittaa merkkejä ostohalukkuudesta.'},

  // --- Q ---
  {letter:'Q', key:'QoQ — Quarter-over-Quarter Growth', en:'Growth comparing this quarter to the prior quarter.', fi:'Kvartaalikasvun mittari.'},
  {letter:'Q', key:'Quick Ratio (Acid Test)', en:'(Current Assets − Inventory) / Current Liabilities — a conservative liquidity measure.', fi:'Konservatiivisempi likviditeettimittari; varasto ei lasketa mukaan.'},

  // --- R ---
  {letter:'R', key:'Run Rate (RR)', en:'Annualized revenue based on current recurring revenue (e.g., monthly revenue × 12). Useful as a quick projection.', fi:'Yhden kuukauden tai jakson perusteella vuositasolle skaalattu liikevaihto tai tulos. Kaava: Kuukausilv × 12.'},
  {letter:'R', key:'RBF — Revenue-Based Financing', en:'Financing where repayments are a percentage of revenue until a cap is reached.', fi:'Rahoitus, jonka takaisinmaksu sidotaan liikevaihtoon.'},
  {letter:'R', key:'ROAS — Return on Ad Spend', en:'Revenue generated per advertising dollar spent.', fi:'Mainontakampanjan tuotto suhteessa kustannuksiin.'},

// Build alphabet bar
const alphaBar = document.getElementById('alphaBar');
const letters = Array.from(new Set(TERMS.map(t=>t.letter))).sort();
letters.forEach(l=>{
  const btn = document.createElement('button'); btn.className='alpha'; btn.textContent=l; btn.setAttribute('aria-label','Kirjaimeen '+l);
  btn.addEventListener('click',()=>{filterByLetter(l);highlightAlpha(l)});
  alphaBar.appendChild(btn);
});

function highlightAlpha(sel){
  document.querySelectorAll('.alpha').forEach(el=>el.classList.toggle('active',el.textContent===sel));
}

// Render content grouped by letter
const content = document.getElementById('content');
function render(all){
  content.innerHTML='';
  const grouped = {};
  all.forEach(t=>{ grouped[t.letter]=grouped[t.letter]||[]; grouped[t.letter].push(t); });
  const sortedLetters = Object.keys(grouped).sort();
  sortedLetters.forEach(letter=>{
    const card = document.createElement('section'); card.className='card';
    const h = document.createElement('div'); h.className='letterHeading';
    h.innerHTML = `<div class='letterBadge'>${letter}</div><div><strong>${letter}</strong> — <span class='hint'>${grouped[letter].length} termiä</span></div>`;
    card.appendChild(h);
    const list = document.createElement('div'); list.className='sectionList';
    grouped[letter].sort((a,b)=>a.key.localeCompare(b.key)).forEach(t=>{
      const term = document.createElement('div'); term.className='term'; term.setAttribute('data-key',t.key.toLowerCase()); term.setAttribute('data-desc', (t.en+' '+t.fi).toLowerCase());
      term.innerHTML = `<div class='k'>${t.key}</div><div class='d'><p>${escapeHtml(t.en)}</p><p>${escapeHtml(t.fi)}</p></div>`;
      list.appendChild(term);
    });
    card.appendChild(list);
    content.appendChild(card);
  });
}
render(TERMS);

// Search functionality
const input = document.getElementById('search');
input.addEventListener('input',e=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ render(TERMS); highlightAlpha(''); updateTopline(); return; }
  const filtered = TERMS.filter(t=> t.key.toLowerCase().includes(q) || (t.en+' '+t.fi).toLowerCase().includes(q));
  render(filtered);
  // highlight letter if single letter present
  const letters = Array.from(new Set(filtered.map(f=>f.letter)));
  if(letters.length===1) highlightAlpha(letters[0]); else highlightAlpha('');
  updateTopline(filtered.length);
});

function filterByLetter(letter){
  const filtered = TERMS.filter(t=>t.letter===letter);
  render(filtered);
  updateTopline(filtered.length);
}

// update header top-line with count + timestamp
function updateTopline(filteredCount){
  const count = (typeof filteredCount === 'number') ? filteredCount : TERMS.length;
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  document.getElementById('topline').textContent = `${count} Terms — Last updated: ${dd}.${mm}.${yyyy}`;
}

// HTML-escape helper
function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Accessibility: focus input on load for mobile
window.onload = ()=>{ input.focus(); updateTopline(); }
</script>
