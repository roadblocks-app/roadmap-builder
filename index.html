<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadblocks.app - Drag & Drop Roadmap Builder</title>
    <meta name="description" content="Create and organize roadmaps with drag-and-drop functionality. Export to PDF for printing.">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Roadblocks">
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/print.css" media="print">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">Roadblocks.app</h1>
                <div class="header-controls">
                    <button id="direction-toggle" class="btn btn-secondary" title="Toggle roadmap direction">
                        <span class="direction-icon">↑</span>
                        <span class="direction-text">Bottom to Top</span>
                    </button>
                    <button id="save-roadmap" class="btn btn-primary">Save</button>
                    <button id="load-roadmap" class="btn btn-secondary">Load</button>
                    <button id="export-pdf" class="btn btn-success">Export PDF</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Text Input Section -->
            <section class="input-section">
                <div class="input-container">
                    <label for="text-input" class="input-label">
                        Paste your AI-generated roadmap text here:
                    </label>
                    <textarea 
                        id="text-input" 
                        class="text-input" 
                        placeholder="Example:&#10;1. Research market trends&#10;2. Create wireframes&#10;3. Develop MVP&#10;4. Launch beta version&#10;5. Gather user feedback"
                        rows="6"
                    ></textarea>
                    <div class="input-actions">
                        <button id="parse-text" class="btn btn-primary">Parse into Milestones</button>
                        <button id="clear-all" class="btn btn-danger">Clear All</button>
                    </div>
                </div>
            </section>

            <!-- Roadmap Section -->
            <section class="roadmap-section">
                <div class="roadmap-header">
                    <h2 id="roadmap-title" class="roadmap-title">My Roadmap</h2>
                    <input type="text" id="title-input" class="title-input" value="My Roadmap" style="display: none;">
                </div>
                
                <div class="bulk-actions-toolbar">
                    <div class="bulk-actions-content">
                        <label class="bulk-checkbox-label">
                            <input type="checkbox" id="select-all-checkbox" class="bulk-checkbox">
                            <span>Select All</span>
                        </label>
                        <select id="bulk-category-select" class="bulk-category-select">
                            <option value="">Change All Categories To...</option>
                            <option value="planning">Planning</option>
                            <option value="development">Development</option>
                            <option value="testing">Testing</option>
                            <option value="launch">Launch</option>
                        </select>
                        <button id="mark-selected-complete" class="btn btn-success">Mark Selected as Completed</button>
                    </div>
                </div>
                
                <div id="roadmap-container" class="roadmap-container">
                    <div id="milestones-list" class="milestones-list">
                        <!-- Milestones will be dynamically added here -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Hidden file input for loading -->
        <input type="file" id="file-input" accept=".json" style="display: none;">
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/dragdrop.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/pdf-export.js"></script>
</body>
</html>
